name: "Build and release"

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitattributes'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-cleanup: on-success

      - name: Build and test
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gradle_args=(--no-daemon check shadowJar)
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" == v* ]]; then
            gradle_args+=("-PreleaseVersion=${REF_NAME#v}")
          fi
          ./gradlew "${gradle_args[@]}"

      - name: Smoke test fat JAR
        run: |
          set -euo pipefail
          java -jar build/libs/abe-all.jar --version
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          mkdir -p "$tmp_dir/in" "$tmp_dir/out" "$tmp_dir/out-stdin"
          printf 'smoke test payload\n' > "$tmp_dir/in/sample.txt"
          tar cf "$tmp_dir/in.tar" -C "$tmp_dir/in" sample.txt

          java -jar build/libs/abe-all.jar pack-kk "$tmp_dir/in.tar" "$tmp_dir/enc.ab" "pässwörd"
          java -jar build/libs/abe-all.jar unpack "$tmp_dir/enc.ab" "$tmp_dir/out.tar" "pässwörd"
          tar xf "$tmp_dir/out.tar" -C "$tmp_dir/out"
          diff -u "$tmp_dir/in/sample.txt" "$tmp_dir/out/sample.txt"

          java -jar build/libs/abe-all.jar pack - - "pipe-pass" < "$tmp_dir/in.tar" \
            | java -jar build/libs/abe-all.jar unpack - "$tmp_dir/out-stdin.tar" "pipe-pass"
          tar xf "$tmp_dir/out-stdin.tar" -C "$tmp_dir/out-stdin"
          diff -u "$tmp_dir/in/sample.txt" "$tmp_dir/out-stdin/sample.txt"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abe-jar
          path: build/libs/abe-all.jar
          if-no-files-found: error

  release:
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download JAR artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: abe-jar
          path: dist

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mv dist/abe-all.jar "abe-${TAG_NAME}.jar"
          sha256sum "abe-${TAG_NAME}.jar" > "abe-${TAG_NAME}.jar.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "abe-${{ github.ref_name }}.jar"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [[ "$TAG_NAME" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$TAG_NAME" \
            LICENSE \
            "abe-${TAG_NAME}.jar" \
            "abe-${TAG_NAME}.jar.sha256" \
            --title "$TAG_NAME" \
            --generate-notes \
            $prerelease_flag
